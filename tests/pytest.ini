[tool:pytest]
# Pytest configuration for Radio Free Luna

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests using browser automation
    slow: Tests that take a long time to run
    api: API endpoint tests
    core: Core functionality tests
    voice: Voice synthesis tests
    context: Context awareness tests
    ai: AI analysis tests

# Test output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Asyncio configuration
asyncio_mode = auto

# Minimum version
minversion = 6.0

# Test directory structure
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    node_modules

# Coverage configuration (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Timeout for long-running tests
timeout = 300

# Parallel execution (if using pytest-xdist)
# addopts = -n auto